<!--
    Estado y validación de Template forms
-->
<section class="contact-form">
    <form #contactForm="ngForm" (ngSubmit)="submitForm()">
        <div class="form-field">
            <label for="email">Email</label>
            <input #email="ngModel" type="email" id="email" name="email" class="form-control" [(ngModel)]="formModel.email" required email>
        </div>
        <div class="input-error" *ngIf="email.invalid && (email.touched || email.dirty)">
            <span *ngIf="email.hasError('required')">
                El email es obligatorio
            </span>
            <span *ngIf="email.hasError('email')">
                El mail no tiene un formato válido
            </span>
        </div>

        <div class="form-field">
            <label for="subject">Subject</label>
            <input #subject="ngModel" type="text" id="subject" name="subject" class="form-control" [(ngModel)]="formModel.subject" required>
        </div>
        <div class="input-error" *ngIf="subject.invalid &&(subject.touched || subject.dirty)">
            <span *ngIf="subject.hasError('required')">
                El sujeto es obligatorio
            </span>
        </div>
        
        <div class="form-field">
            <label for="message">Message</label>
            <textarea #message="ngModel" id="message" name="message" class="form-control" [(ngModel)]="formModel.message" required></textarea>
        </div>
        <div class="input-error" *ngIf="message.invalid &&(message.touched || message.dirty)">
            <span *ngIf="message.hasError('required')">
                El mensaje es obligatorio
            </span>
        </div>

        <button [disabled]="contactForm.invalid" type="submit" class="form-button">
            Enviar
        </button>
    </form>

</section>
